[package]
name = "vmm-sys-util"
version = "0.15.0"
authors = ["Intel Virtualization Team <vmm-maintainers@intel.com>"]
description = "A system utility set"
repository.workspace = true
readme = "README.md"
keywords = ["utils"]
edition = "2021"
license = "BSD-3-Clause"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
with-serde = ["serde", "serde_derive"]

[dependencies]
libc = "0.2.127"
serde = { version = "1.0.27", optional = true }
serde_derive = { version = "1.0.27", optional = true }
bitflags = "2.13"

# `Win32_Security` looks out of place but is required: `CreateEventA` is gated on it
# because its first parameter is a `*const SECURITY_ATTRIBUTES`. `SYNCHRONIZE` lives
# under `Win32_Storage_FileSystem` (generic access rights are grouped there).
[target.'cfg(target_family = "windows")'.dependencies.windows-sys]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Memory",
    "Win32_System_Threading",
]

[dev-dependencies]
serde_json = "1.0.9"
